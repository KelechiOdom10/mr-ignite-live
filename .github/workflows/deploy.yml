name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Atomic deploys send traffic before the readiness probe, and Cloudflare takes about 55s to route a staged version.
    timeout-minutes: 30
    steps:
      - name: CLOUDFLARE_API_TOKEN is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN is missing::Add a repository secret CLOUDFLARE_API_TOKEN with Workers Scripts: Edit, Workers KV Storage: Read and D1: Edit. See README.md#deploy for the full permission list."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # `.void/` is gitignored, so a fresh checkout has no saved platform, and the deploy log only reaches the runner unless it is mirrored.
      - run: bun run deploy --platform cloudflare --debug
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
